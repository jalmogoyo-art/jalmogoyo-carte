name: Build (APK + site)

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the menu
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate menu data
        run: node tools/check-menu.js
      - id: build
        run: echo "build=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  site:
    name: Online version (updates the tablets)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: node tools/stamp.js "${{ needs.check.outputs.build }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      # If Settings → Pages → Source is "Deploy from a branch" instead of "GitHub Actions",
      # GitHub also publishes the repository root (the README, not the menu) at each push.
      # Let that finish first, so that the menu is always what gets published last.
      - name: Wait for GitHub's own Pages build, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq "[.workflow_runs[] | select(.path == \"dynamic/pages/pages-build-deployment\" $1)] | length" 2>/dev/null || echo 0
          }
          # "workflow" = GitHub Actions (correct) · "legacy" = Deploy from a branch
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Réglage GitHub Pages (build_type) : $mode"
          if [ "$mode" = "workflow" ]; then echo "Source : GitHub Actions (OK)"; exit 0; fi
          sleep 10
          if [ "$mode" != "legacy" ] && [ "$(runs '')" = "0" ]; then echo "Source : GitHub Actions (OK)"; exit 0; fi
          echo "::warning title=Réglage GitHub Pages à corriger::Settings → Pages → Source doit être « GitHub Actions » (actuellement « Deploy from a branch »)."
          for i in $(seq 1 36); do
            [ "$(runs 'and .status != "completed"')" = "0" ] && break
            sleep 5
          done
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Check that the tablets receive this version
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
          BUILD: ${{ needs.check.outputs.build }}
        run: |
          for i in $(seq 1 24); do
            live=$(curl -fsS "${URL}version.json?t=$(date +%s)" 2>/dev/null | sed -n 's/.*"build":"\([^"]*\)".*/\1/p' || true)
            echo "En ligne : v${live:-?} (attendu : v$BUILD)"
            if [ "$live" = "$BUILD" ]; then exit 0; fi
            sleep 5
          done
          echo "::error title=Version en ligne incorrecte::${URL} ne sert pas la version v$BUILD du menu. Vérifier Settings → Pages → Source = « GitHub Actions »."
          exit 1

  apk:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stamp version
        run: node tools/stamp.js "${{ needs.check.outputs.build }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PversionCode=${{ needs.check.outputs.build }}
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk jalmogoyo-menu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jalmogoyo-menu-apk
          path: jalmogoyo-menu.apk
      # The tablets update their menu from the online version, so a new APK is only
      # published when the Android shell itself changed (or on a manual run).
      - name: Publish release (only when the Android app changed)
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.check.outputs.build }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
             || ! gh release view >/dev/null 2>&1 \
             || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- android .github; then
            gh release create "v1.$BUILD" jalmogoyo-menu.apk \
              --target "$GITHUB_SHA" --latest \
              --title "Jalmogoyo Menu 1.$BUILD" \
              --notes "APK pour tablette Android. Installation : https://jalmogoyo-art.github.io/jalmogoyo-carte/install.html"
          else
            echo "Android app unchanged: no new release."
          fi
